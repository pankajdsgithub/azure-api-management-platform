apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: platform-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: mcr.microsoft.com/azuredocs/containerapps-helloworld:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: platform-dev
spec:
  selector:
    app: dashboard
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
