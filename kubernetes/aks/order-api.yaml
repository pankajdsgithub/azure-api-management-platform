apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: platform-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
        - name: order-api
          image: mcr.microsoft.com/azuredocs/containerapps-helloworld:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: platform-dev
spec:
  selector:
    app: order-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
