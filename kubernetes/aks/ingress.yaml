apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: platform-dev
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api-platform.example.com
      http:
        paths:
          - path: /customers
            pathType: Prefix
            backend:
              service:
                name: customer-api
                port:
                  number: 80
          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-api
                port:
                  number: 80
          - path: /events
            pathType: Prefix
            backend:
              service:
                name: kafka-sample
                port:
                  number: 80
          - path: /dashboard
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 80
